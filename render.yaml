# Render Blueprint. Connect the repo once, apply this, and both services exist.
#
# The database is deliberately not here. Render's free Postgres expires after 30
# days, which would take the pilot down before the defence. Neon's free tier has
# no such clock and supports PostGIS, which this schema requires.

services:
  # ---------------------------------------------------------------- backend --
  - type: web
    name: ekoalert-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    # Closest Render region to Lagos.
    region: frankfurt
    # Liveness only, and deliberately not /api/v1/graph. That endpoint runs three
    # findAll queries, and a health check runs forever, which would hold Neon
    # awake around the clock and burn a month of free compute in days.
    healthCheckPath: /actuator/health
    # The SSE listener list is in memory and the de-escalation sweep has no
    # locking, so a second instance would mean missed alerts and duplicate
    # all-clears. One instance is a correctness constraint, not thrift.
    numInstances: 1
    envVars:
      # jdbc:postgresql://HOST/DB?sslmode=require
      # Neon hands you postgres://user:pass@host/db. Change the scheme to
      # jdbc:postgresql:// and take the credentials out; they go in the two
      # variables below. Nothing else to append: the enum handling the schema
      # needs is a driver property in application.yml, not something a person
      # has to remember to type.
      - key: EKOALERT_DB_URL
        sync: false
      - key: EKOALERT_DB_USER
        sync: false
      - key: EKOALERT_DB_PASSWORD
        sync: false
      # Generated by Render, never seen by anyone. Must be >= 32 bytes or the
      # app refuses to start.
      - key: EKOALERT_JWT_SECRET
        generateValue: true
      # The built in one is printed in a public README and unlocks an admin who
      # can halt every alert.
      - key: EKOALERT_DEMO_PASSWORD
        sync: false
      # Exact origins, comma separated. No wildcards, no preview URLs.
      - key: EKOALERT_CORS_ALLOWED_ORIGINS
        sync: false

  # --------------------------------------------------------------- frontend --
  - type: web
    name: ekoalert-web
    runtime: static
    # No plan here. A static site has no compute to size, so Render rejects the
    # field outright rather than ignoring it.
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      # Vite inlines this at build time, so it has to be present when Render
      # builds, not when the page loads. https, or the browser blocks the calls
      # from an https page as mixed content.
      - key: VITE_API_BASE
        sync: false
    routes:
      # BrowserRouter uses real paths, so /activity and /admin/replay have to
      # reach index.html rather than 404 on a refresh or a shared link.
      - type: rewrite
        source: /*
        destination: /index.html
