spring:
  application:
    name: ekoalert
  datasource:
    # stringtype=unspecified lets PostgreSQL coerce the bound text into the
    # edge_confidence and severity enum columns. Without it the driver sends a
    # typed varchar and the server refuses it.
    url: ${EKOALERT_DB_URL:jdbc:postgresql://localhost:5432/ekoalert?stringtype=unspecified}
    username: ${EKOALERT_DB_USER:ekoalert}
    password: ${EKOALERT_DB_PASSWORD:ekoalert}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    # Flyway owns the schema. Hibernate never touches it.
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}

ekoalert:
  # Two reports from two distinct verified reporters inside this window escalate
  # a zone. The lower of the two levels wins.
  quorum-window: PT45M
  quorum-size: 2
  # No new report for this long and the zone clears, with an all-clear to
  # everyone who heard from it.
  de-escalation-after: PT90M
  de-escalation-sweep: PT1M
  # Errors compound with depth, and false alarms destroy trust faster than
  # missed alarms do.
  max-hops: 3
  require-confirmed-edges: true
  # A threshold, not one vote.
  correction-threshold: 2
  flow-rate-meters-per-minute: 55
  min-travel-minutes: 1
  seed:
    csv: ${EKOALERT_SEED_CSV:classpath:seed/ekoalert_zones.csv}
  jwt:
    secret: ${EKOALERT_JWT_SECRET:ekoalert-development-secret-do-not-use-in-production}
    ttl: PT12H
  sse:
    timeout-millis: 1800000
    # A silent stream is indistinguishable from a dead one to a reverse proxy,
    # and silence is this system's normal state. Comment frames keep it open.
    keepalive-millis: 20000
  # Exact origins, never wildcards. The map is public but reporting is not, and
  # a wildcard would let any page a reporter has open spend their token.
  cors:
    allowed-origins: ${EKOALERT_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  # Only reachable behind --demo-users. Overridden on any deployment somebody
  # else can reach, because the default is printed in a public README.
  demo-password: ${EKOALERT_DEMO_PASSWORD:ekoalert-demo}

# A platform health check runs forever, so what it costs matters. The database
# indicator is off deliberately: a managed Postgres that scales to zero would be
# held awake by the check alone, and on a free tier that exhausts the monthly
# compute allowance and takes the database down. Liveness is also the honest
# question, because restarting this process does not repair a database that is
# down, which is the only thing a failed health check causes.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: false

logging:
  level:
    ng.ekoalert: INFO
