spring:
  application:
    name: ekoalert
  datasource:
    # stringtype=unspecified lets PostgreSQL coerce the bound text into the
    # edge_confidence and severity enum columns. Without it the driver sends a
    # typed varchar and the server refuses it.
    url: ${EKOALERT_DB_URL:jdbc:postgresql://localhost:5432/ekoalert?stringtype=unspecified}
    username: ${EKOALERT_DB_USER:ekoalert}
    password: ${EKOALERT_DB_PASSWORD:ekoalert}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    # Flyway owns the schema. Hibernate never touches it.
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}

ekoalert:
  # Two reports from two distinct verified reporters inside this window escalate
  # a zone. The lower of the two levels wins.
  quorum-window: PT45M
  quorum-size: 2
  # No new report for this long and the zone clears, with an all-clear to
  # everyone who heard from it.
  de-escalation-after: PT90M
  de-escalation-sweep: PT1M
  # Errors compound with depth, and false alarms destroy trust faster than
  # missed alarms do.
  max-hops: 3
  require-confirmed-edges: true
  # A threshold, not one vote.
  correction-threshold: 2
  flow-rate-meters-per-minute: 55
  min-travel-minutes: 1
  seed:
    csv: ${EKOALERT_SEED_CSV:classpath:seed/ekoalert_zones.csv}
  jwt:
    secret: ${EKOALERT_JWT_SECRET:ekoalert-development-secret-do-not-use-in-production}
    ttl: PT12H
  sse:
    timeout-millis: 1800000

logging:
  level:
    ng.ekoalert: INFO
